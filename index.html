<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doña Rosa en Casa</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f6f3ed;color:#191713}.hero{min-height:94vh;background:radial-gradient(circle at 50% 20%,#39280f 0,#100d08 42%,#050505 75%);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.hero img{max-width:330px;max-height:360px;object-fit:contain;filter:drop-shadow(0 18px 32px #000)}.hero h1{font-size:44px;margin:10px 0 0;color:#f2cf73}.script{font-family:Georgia,serif;font-style:italic;font-size:25px}.gold{background:linear-gradient(#ffe69a,#eeb538);border:1px solid #fff0b0;color:#151007;font-weight:900;border-radius:14px;padding:16px 28px;font-size:19px;box-shadow:0 8px 28px #0008;cursor:pointer}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:28px;border-top:1px solid #7e632e}.quick button{background:none;border:0;color:white;padding:15px 5px;font-size:11px}.quick b{display:block;color:#efc24f;font-size:27px;margin-bottom:7px}.wrap{max-width:1180px;margin:auto;padding:26px 18px}.title{text-align:center;font-size:31px}.filters{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#f6f3ed;padding:12px 0;z-index:5}.filters input,.filters select,.form input,.form select,.form textarea{padding:13px;border:1px solid #d9d0c0;border-radius:10px;background:white;font-size:15px}.filters input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:12px;box-shadow:0 6px 24px #4a3c2512;position:relative}.card img{width:100%;height:180px;object-fit:contain;border-radius:12px;background:#fafafa}.ph{height:180px;display:grid;place-items:center;background:#f1eee7;border-radius:12px;font-size:44px}.badge{position:absolute;top:20px;left:20px;background:#d9a62d;color:#171108;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.price{font-size:22px;font-weight:900}.old{text-decoration:line-through;color:#888;font-size:13px}.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid #e0d8c8;border-radius:10px;margin:9px 0}.qty button{border:0;background:#eee5d3;padding:10px 14px;font-size:18px}.qty span{font-weight:800}.add{width:100%;padding:11px;border:0;border-radius:10px;background:#17140e;color:#f2c95e;font-weight:800}.offers{display:flex;gap:14px;overflow:auto;padding:8px 2px 20px}.offer{min-width:280px;background:#15120d;color:white;border-radius:18px;padding:14px}.offer img{width:100%;height:150px;object-fit:contain;background:white;border-radius:12px}.cartbtn{position:fixed;right:18px;bottom:18px;background:#e7b73f;color:#171108;border:0;border-radius:999px;padding:14px 18px;font-weight:900;box-shadow:0 8px 25px #0005;z-index:9}.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:white;z-index:20;padding:20px;box-shadow:-12px 0 40px #0004;overflow:auto;display:none}.drawer.open{display:block}.line{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #eee;padding:10px 0}.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{font-size:24px;font-weight:900;text-align:right;margin:16px 0}.note{background:#fff6dc;border:1px solid #eed28a;border-radius:10px;padding:10px;font-size:13px}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px}.muted{color:#746d62;font-size:13px}@media(max-width:600px){.hero h1{font-size:35px}.quick{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:8px}.card img,.ph{height:130px}.two{grid-template-columns:1fr}}
</style></head><body><section class="hero"><div><img src="" onerror="this.style.display='none'"><h1>POLIRRUBRO DOÑA ROSA</h1><div class="script">Doña Rosa en Casa</div><p>Tu compra, más cerca. Delivery y retiro en el local.</p><button class="gold" onclick="goCat()">🛒 COMPRAR AHORA ›</button><div class="quick"><button onclick="goCat()"><b>🛍</b>CATÁLOGO<br>DE PRODUCTOS</button><button onclick="document.querySelector('#ofertas').scrollIntoView({behavior:'smooth'})"><b>🏷</b>OFERTAS<br>EXCLUSIVAS</button><button onclick="openCart('Envío a domicilio')"><b>🚚</b>ENVÍOS<br>A DOMICILIO</button><button onclick="openCart('Retiro en local')"><b>🏪</b>RETIRO<br>EN EL LOCAL</button></div></div></section><main class="wrap"><section id="ofertas"><h2 class="title">Ofertas para aprovechar</h2><div class="offers" id="offers"></div></section><section id="catalogo"><h2 class="title">Catálogo</h2><div class="filters"><input id="q" placeholder="¿Qué estás buscando?" oninput="render()"><select id="rub" onchange="render()"><option value="">Todos los rubros</option></select><select id="sub" onchange="render()"><option value="">Todos los subrubros</option></select></div><div class="grid" id="grid"></div></section></main><button class="cartbtn" onclick="openCart()">🛒 Carrito · <span id="count">0</span></button><aside class="drawer" id="drawer"><button class="close" onclick="drawer.classList.remove('open')">×</button><h2>Tu pedido</h2><div id="cartlines"></div><div class="total" id="total"></div><div class="form"><h3>Datos y entrega</h3><div class="two"><input id="nombre" placeholder="Nombre y apellido"><input id="tel" placeholder="WhatsApp"></div><select id="mode" onchange="deliveryFields()"><option>Envío a domicilio</option><option>Retiro en local</option></select><div id="address"><input id="direccion" placeholder="Dirección"><div class="two"><input id="localidad" value="Timbúes" placeholder="Localidad"><input id="referencia" placeholder="Referencia"></div></div><div class="two"><input id="fecha" type="date"><input id="hora" type="time"></div><select id="pago"><option>Efectivo</option><option>Transferencia</option><option>QR</option><option>Tarjeta de débito</option></select><textarea id="obs" placeholder="Observaciones del pedido"></textarea><div class="note">Pedidos realizados hasta las 14:00 pueden entregarse en el día según disponibilidad. El horario queda sujeto a confirmación de Doña Rosa.</div><button class="gold" onclick="sendOrder()">ENVIAR PEDIDO POR WHATSAPP</button></div></aside><script>
const P=[{"id": 42, "codigo": "7790895000997", "nombre": "COCA COLA DESC X 2.25 LTS", "descripcion": "Coca Cola Desc x 2.25lt", "rubro": "Bebidas", "subrubro": "Gaseosas", "precio": 0, "stock": 5.0, "imagen": "", "destacado": true, "tipo": "Unidad", "min": 1.0, "inc": 1.0, "promo": "", "precio_normal": 0}, {"id": 40, "codigo": "23", "nombre": "QUESO CREMOSO X KG", "descripcion": "QUESO CREMOSO LEI LAC", "rubro": "Lácteos", "subrubro": "Quesos", "precio": 12500.0, "stock": 89.81200000000001, "imagen": "", "destacado": true, "tipo": "Pesable", "min": 0.1, "inc": 0.5, "promo": "", "precio_normal": 15000.0}, {"id": 9369, "codigo": "7792798014934", "nombre": "CERVEZA ANDES ORIGEN ORO LATA X 473CC", "descripcion": "CERVEZA ANDES ORIGEN ORO LATA X 473CC", "rubro": "Bebidas", "subrubro": "Cervezas", "precio": 2500.0, "stock": 8.0, "imagen": "", "destacado": false, "tipo": "Unidad", "min": 1.0, "inc": 1.0, "promo": "LLEVANDO 2 X $5000", "precio_normal": 3100.0}],PHONE='',FREELOCAL=10000,FREEOUT=20000,SHIPLOCAL=0,SHIPOUT=0,MINIMUM=0,ZONE='Timbúes';let cart={};const money=n=>'$'+Math.round(n).toLocaleString('es-AR');function goCat(){document.querySelector('#catalogo').scrollIntoView({behavior:'smooth'});setTimeout(()=>q.focus(),600)}function img(p){return p.imagen?`<img src="${p.imagen}" onerror="this.outerHTML='<div class=ph>🛍️</div>'">`:'<div class=ph>🛍️</div>'}function unit(p,n){return p.tipo==='Pesable'?Math.round(n*1000)+' g':n+' u.'}function step(id,d){let p=P.find(x=>x.id===id),v=cart[id]?.q??p.min;v=Math.max(p.min,Math.round((v+d*p.inc)*1000)/1000);if(cart[id])cart[id].q=v;document.querySelector('#n'+id).textContent=unit(p,v);update()}function add(id){let p=P.find(x=>x.id===id);cart[id]=cart[id]||{p,q:p.min};update()}function card(p){let z=cart[p.id]?.q??p.min;return `<article class=card>${p.promo?`<span class=badge>${p.promo}</span>`:''}${img(p)}<div class=muted>${p.rubro}${p.subrubro?' · '+p.subrubro:''}</div><b>${p.nombre}</b><p class=muted>${p.descripcion||''}</p>${p.precio_normal?`<span class=old>${money(p.precio_normal)}</span>`:''}<div class=price>${money(p.precio)}${p.tipo==='Pesable'?'/kg':''}</div><div class=qty><button onclick="step(${p.id},-1)">−</button><span id=n${p.id}>${unit(p,z)}</span><button onclick="step(${p.id},1)">+</button></div><button class=add onclick="add(${p.id})">Agregar al carrito</button></article>`}function render(){let t=q.value.toLowerCase(),r=rub.value,s=sub.value;grid.innerHTML=P.filter(p=>(!t||(p.nombre+' '+p.descripcion).toLowerCase().includes(t))&&(!r||p.rubro===r)&&(!s||p.subrubro===s)).map(card).join('')}function update(){let a=Object.values(cart),sum=a.reduce((x,i)=>x+i.q*i.p.precio,0);count.textContent=a.length;total.textContent='Subtotal '+money(sum);cartlines.innerHTML=a.map(i=>`<div class=line><div><b>${i.p.nombre}</b><br><span class=muted>${unit(i.p,i.q)} × ${money(i.p.precio)}${i.p.tipo==='Pesable'?'/kg':''}</span></div><b>${money(i.q*i.p.precio)}</b></div>`).join('')||'<p>Tu carrito está vacío.</p>';render()}function openCart(m){if(m)mode.value=m;drawer.classList.add('open');deliveryFields();update()}function deliveryFields(){address.style.display=mode.value==='Retiro en local'?'none':'grid'}function ship(sub){if(mode.value==='Retiro en local')return 0;let local=(localidad.value||'').toLowerCase().includes(ZONE.toLowerCase());return local?(sub>=FREELOCAL?0:SHIPLOCAL):(sub>=FREEOUT?0:SHIPOUT)}function sendOrder(){let a=Object.values(cart);if(!a.length)return alert('Agregá productos al carrito.');if(!nombre.value.trim()||!tel.value.trim())return alert('Completá nombre y WhatsApp.');if(mode.value==='Envío a domicilio'&&!direccion.value.trim())return alert('Completá la dirección.');let sub=a.reduce((x,i)=>x+i.q*i.p.precio,0);if(mode.value==='Envío a domicilio'&&sub<MINIMUM)return alert('El pedido mínimo para delivery es '+money(MINIMUM));let env=ship(sub),tot=sub+env;let lines=a.map(i=>`• ${unit(i.p,i.q)} ${i.p.nombre} = ${money(i.q*i.p.precio)}`).join('\n');let text=`🛒 *NUEVO PEDIDO - DOÑA ROSA EN CASA*\n\nCliente: ${nombre.value}\nWhatsApp: ${tel.value}\n${lines}\n\nSubtotal: ${money(sub)}\nEnvío: ${env?money(env):'SIN CARGO'}\n*TOTAL: ${money(tot)}*\n\nModalidad: ${mode.value}\n${mode.value==='Envío a domicilio'?`Dirección: ${direccion.value}, ${localidad.value}\nReferencia: ${referencia.value}\n`:''}Fecha solicitada: ${fecha.value||'a coordinar'}\nHorario: ${hora.value||'a coordinar'}\nPago: ${pago.value}\nObservaciones: ${obs.value||'-'}\n\nPor favor confirmar disponibilidad, total y horario.`;window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`,'_blank')}let rs=[...new Set(P.map(p=>p.rubro).filter(Boolean))],ss=[...new Set(P.map(p=>p.subrubro).filter(Boolean))];rub.innerHTML+=rs.map(x=>`<option>${x}</option>`).join('');sub.innerHTML+=ss.map(x=>`<option>${x}</option>`).join('');offers.innerHTML=P.filter(p=>p.destacado||p.promo).slice(0,12).map(p=>`<div class=offer>${img(p)}<h3>${p.nombre}</h3><p>${p.promo||'Oferta destacada'}</p><b>${money(p.precio)}</b><br><button class=gold onclick="add(${p.id})">Agregar</button></div>`).join('')||'<p class=muted>No hay ofertas publicadas todavía.</p>';render();deliveryFields();
</script></body></html>
